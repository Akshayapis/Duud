services:
  - type: web
    name: u-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uapp-data
      mountPath: /var/uapp-data
      sizeGB: 10
    envVars:
      - key: APP_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: KAGGLE_TIMEOUT_MINUTES
        value: "30"
      - key: KAGGLE_WORKER_SLUG
        value: uapp-android-build-worker
      - key: REQUIRE_AUTH
        value: "true"
      - key: DATA_DIR
        value: /var/uapp-data
      - key: DOWNLOAD_TTL_SECONDS
        value: "540"
      - key: MAX_SOURCE_MB
        value: "150"
      - key: MAX_ARTIFACT_MB
        value: "250"
      - key: BUILD_UPLOAD_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
